# Checks that keep typos and malformed markup out of the published site.
#
# Two callers: a pull request runs them before anything is merged, and the
# deploy workflow (static.yml) runs them as its first job, so a failure stops
# the upload instead of publishing first and going red afterwards.
name: Validate pages

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check shared header and footer
        run: node scripts/sync-shared-blocks.mjs --check

      # Catches a photo file that is not there, a missing thumbnail, an
      # impossible date, a duplicate id, or a closure on a night the club
      # does not meet.
      - name: Check the data files
        run: node scripts/check-data.mjs

      # The book descriptions live in assets/books/descriptions.json and are
      # copied into the page; this fails if the two disagree.
      - name: Check the book descriptions
        run: node scripts/generate-books-table.mjs --check

      # The tournament cards and the photo gallery are written into their
      # pages from the JSON files; this fails if a page has fallen behind.
      - name: Check the tournament cards
        run: node scripts/render-tournaments.mjs --check

      - name: Check the photo gallery
        run: node scripts/render-gallery.mjs --check

      # The posts are written into posts-and-news.html from assets/posts.json.
      - name: Check the posts
        run: node scripts/render-posts.mjs --check

      # The home page banner is written into index.html from
      # assets/banner.json so it is in the page before it paints.
      - name: Check the announcement banner
        run: node scripts/render-banner.mjs --check

      # Rules live in .htmlvalidate.json.
      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 '*.html'

      # Settings live in .lychee.toml: internal links and #anchors only.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml '*.html'
