# Checks that keep typos and malformed markup out of the published site.
#
# Two callers: a pull request runs them before anything is merged, and the
# deploy workflow (static.yml) runs them as its first job, so a failure stops
# the upload instead of publishing first and going red afterwards.
name: Validate pages

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # One list of checks, in scripts/check-all.mjs: the shared header,
      # footer and preview tags, the data files, the weekly meeting details
      # against the pages that state them in prose, the generated blocks
      # (books, tournaments, gallery, posts, banner, event / FAQ / meeting
      # structured data), and the syntax of every script in assets/.
      #
      # It runs them all and reports every failure, so one push shows all of
      # the problems rather than stopping at the first. The deploy workflow
      # runs the same script before it uploads anything.
      - name: Run the repository checks
        run: node scripts/check-all.mjs

      # Rules live in .htmlvalidate.json.
      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 '*.html'

      # Settings live in .lychee.toml: internal links and #anchors only.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml '*.html'
