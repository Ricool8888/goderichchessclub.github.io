# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # The same checks a pull request runs. The deploy job waits for them, so a
  # page that fails validation never reaches the live site.
  checks:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so each page's footer date can come from the commit
          # that last touched that page.
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check shared header and footer
        run: node scripts/sync-shared-blocks.mjs --check
      - name: Stamp last-updated dates
        run: node scripts/stamp-last-updated.mjs
      - name: Generate event structured data
        run: node scripts/generate-event-schema.mjs
      - name: Generate FAQ structured data
        run: node scripts/generate-faq-schema.mjs
      - name: Generate recurring-meeting structured data
        run: node scripts/generate-meeting-schema.mjs
      - name: Rebuild the book descriptions
        run: node scripts/generate-books-table.mjs
      - name: Rebuild the tournament cards
        run: node scripts/render-tournaments.mjs
      - name: Rebuild the photo gallery
        run: node scripts/render-gallery.mjs
      - name: Rebuild the posts
        run: node scripts/render-posts.mjs
      - name: Rebuild the announcement banner
        run: node scripts/render-banner.mjs
      - name: Check the data files
        run: node scripts/check-data.mjs
      # Copies the site - the pages, assets/, and the root files a browser
      # needs - into dist/. The handbook, the build scripts, the partials and
      # the 39 MB of camera originals in assets/gallery/ stay in the repository
      # but are not published. The script fails rather than uploading a site
      # with a missing file.
      - name: Build the published site
        run: node scripts/build-site.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only what this site serves, not the whole repository
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
